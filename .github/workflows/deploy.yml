# Workflow to build and deploy static Next.js site to GitHub Pages
name: Deploy Static Content to Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true


jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=yarn" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package-lock.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=ci" >> $GITHUB_OUTPUT
            echo "runner=npm" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            echo "runner=npm" >> $GITHUB_OUTPUT
            exit 0
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: ${{ steps.detect-package-manager.outputs.manager }}

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Restore cache
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json', '**/yarn.lock') }}-

      - name: Install dependencies
        run: ${{ steps.detect-package-manager.outputs.runner }} ${{ steps.detect-package-manager.outputs.command }}

      - name: Build with Next.js
        env:
          NEXT_PUBLIC_GITHUB_TOKEN: ${{ secrets.NEXT_PUBLIC_GITHUB_TOKEN }}
          CONTACT_GOOGLE_FORM_URL: ${{ secrets.CONTACT_GOOGLE_FORM_URL }}
          CONTACT_GOOGLE_ENTRY_NAME: ${{ secrets.CONTACT_GOOGLE_ENTRY_NAME }}
          CONTACT_GOOGLE_ENTRY_EMAIL: ${{ secrets.CONTACT_GOOGLE_ENTRY_EMAIL }}
          CONTACT_GOOGLE_ENTRY_INQUIRY_TYPE: ${{ secrets.CONTACT_GOOGLE_ENTRY_INQUIRY_TYPE }}
          CONTACT_GOOGLE_ENTRY_MOBILE: ${{ secrets.CONTACT_GOOGLE_ENTRY_MOBILE }}
          CONTACT_GOOGLE_ENTRY_SUBJECT: ${{ secrets.CONTACT_GOOGLE_ENTRY_SUBJECT }}
          CONTACT_GOOGLE_ENTRY_MESSAGE: ${{ secrets.CONTACT_GOOGLE_ENTRY_MESSAGE }}
          JOB_APPS_SCRIPT_URL: ${{ secrets.JOB_APPS_SCRIPT_URL }}
          JOB_GOOGLE_FORM_URL: ${{ secrets.JOB_GOOGLE_FORM_URL }}
          JOB_GOOGLE_ENTRY_JOB_TITLE: ${{ secrets.JOB_GOOGLE_ENTRY_JOB_TITLE }}
          JOB_GOOGLE_ENTRY_NAME: ${{ secrets.JOB_GOOGLE_ENTRY_NAME }}
          JOB_GOOGLE_ENTRY_EMAIL: ${{ secrets.JOB_GOOGLE_ENTRY_EMAIL }}
          JOB_GOOGLE_ENTRY_MOBILE: ${{ secrets.JOB_GOOGLE_ENTRY_MOBILE }}
          JOB_GOOGLE_ENTRY_EXPERIENCE: ${{ secrets.JOB_GOOGLE_ENTRY_EXPERIENCE }}
          JOB_GOOGLE_ENTRY_SKILLS: ${{ secrets.JOB_GOOGLE_ENTRY_SKILLS }}
          JOB_GOOGLE_ENTRY_COVER_NOTE: ${{ secrets.JOB_GOOGLE_ENTRY_COVER_NOTE }}
        run: ${{ steps.detect-package-manager.outputs.runner }} run build


      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
